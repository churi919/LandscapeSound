<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LandscapeSound 连续声景试听</title>
<style>:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#193d30;background:#f5f7f1}*{box-sizing:border-box}body{margin:0;padding:18px}main{max-width:1100px;margin:auto}h2{font-size:21px;margin:0 0 10px}p{font-size:14px;line-height:1.7}.toolbar,.actions,.mix{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;border:1px solid #91ad9b;border-radius:8px;padding:10px 13px;min-height:44px;background:white;color:#193d30;cursor:pointer}button.primary{background:#205c45;color:white}button.stop{border-color:#ae684f;color:#8d3924}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #267fb2;outline-offset:3px}button:disabled{opacity:.5}label{font-size:14px}input[type=range]{accent-color:#24624b}#status{padding:11px;background:#e5eee4;border-radius:8px;font-size:14px;min-height:42px}#plan-summary{font-size:14px;color:#3f6150}.mix label{display:flex;gap:8px;align-items:center}.mix input{width:120px}.source-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}.source{background:white;padding:12px;border:1px solid #d1dfd2;border-radius:9px}.source h3{font-size:14px;margin:0 0 10px}.source .row{margin:10px 0}.source input[type=range]{width:100%}.source input[type=checkbox]{width:18px;height:18px;vertical-align:middle}details{margin-top:15px}summary{font-size:14px;cursor:pointer;min-height:34px}.note{font-size:12px;color:#52675b}#credits p{font-size:12px;margin:5px 0}a{color:#216b4d}output{min-width:30px}</style>
<main aria-label="景观声音与描述播放器"><h2>连续声景试听</h2><p>同类区域整理成连续纹理，避免同一段声音同步堆叠。可用素材会在下方列出，均用于模拟预体验，并非照片现场录音。</p>
<div class="toolbar"><label for="version">声音版本</label><select id="version">__PRESET_OPTIONS__</select><label for="mode">空间方式</label><select id="mode"><option value="depth">深度驱动双耳声景</option><option value="flat">普通混音对照</option></select></div>
<p id="material-status" class="note" aria-live="polite"></p>
<p id="comparison-policy" class="note"></p>
<div class="actions"><button id="play" class="primary">播放声景</button><button id="stop" class="stop">停止全部声音</button><button id="calibrate">左右耳校准</button><button id="export">下载试听设置</button></div>
<div class="toolbar"><label for="narration-voice">朗读配音</label><select id="narration-voice"></select><button id="speak">朗读景观描述</button><label for="narration-volume">朗读音量 <input id="narration-volume" type="range" min="0" max="1" step="0.05" value="0.8"></label></div>
<p class="note" id="voice-status" aria-live="polite"></p>
<div class="mix"><label for="volume">总音量 <input id="volume" type="range" min="0" max="0.6" step="0.01" value="0.25"><output id="volume-value">25%</output></label>__CATEGORY_CONTROLS__</div>
<div id="status" role="status" aria-live="polite">尚未播放。建议佩戴立体声耳机。</div><p id="plan-summary"></p>
<details><summary>调整图像区域的方位和远近</summary><p class="note">这里的修改仅用于试听。需要保存图像分析校正时，请使用应用中的校正表单。</p><div id="source-controls" class="source-grid"></div></details>
<details><summary>景观描述与素材来源</summary><p>__DESCRIPTION__</p><div id="credits"></div><p class="note">可选版本由当前已备齐的素材决定；有对应自然录音时才提供录音选项。各条件采用相同的连续混音、方位和距离规则，具体对照条件以评估页为准。当前试听尚不能代替主观听感实验；人工鸟鸣选项若存在，仍为程序示例。</p></details>
<details><summary>播放状态与工程自检</summary><button id="selftest">静音检验新版混音</button><pre id="diagnostics" style="white-space:pre-wrap;font-size:12px"></pre></details>
</main><script>const CONFIG=__PAYLOAD__;</script><script>__SCRIPT__</script></html>
