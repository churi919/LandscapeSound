:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#18313e;background:#f3f6f7}*{box-sizing:border-box}body{margin:0}main{max-width:1140px;margin:auto;padding:24px 20px 60px}.topbar{display:flex;align-items:center;flex-wrap:wrap;gap:20px;margin-bottom:24px}.brand{font-weight:750;text-decoration:none;color:#18313e}nav{display:flex;flex-wrap:wrap;gap:16px;flex:1;font-size:13px}.languages{display:flex;gap:5px}.languages a{padding:7px 10px;border-radius:8px;text-decoration:none}.languages [aria-current]{background:#176562;color:white}header{padding:36px;background:#112e40;color:#fff;border-radius:24px}h1{font-size:clamp(28px,4vw,44px);line-height:1.25;margin:12px 0}header p{color:#d7e8e9}h2{font-size:23px;margin:10px 0}h3{font-size:16px;margin:20px 0 8px}p{line-height:1.8}a{color:#176562}.eyebrow{font-size:12px;letter-spacing:.14em;color:#baf0df}.note{background:#fff2d8;border:1px solid #e3d3ad;border-radius:16px;padding:18px 22px;margin:22px 0}.note p{margin:8px 0 12px}button{font:inherit;cursor:pointer;border:1px solid #176562;border-radius:10px;padding:10px 16px;background:#fff;color:#176562;min-height:44px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:24px}article{border:1px solid #d4e0e4;background:#fff;border-radius:19px;overflow:hidden}article img{display:block;width:100%;aspect-ratio:2;object-fit:cover}.content{padding:22px}.tag{font-size:12px;color:#176562;font-weight:700;letter-spacing:.08em}label{display:block;font-size:14px;font-weight:600;margin:20px 0 8px}audio{display:block;width:100%;min-height:44px}details{margin-top:18px}summary{cursor:pointer;min-height:44px;padding:10px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6;background:#f0f5f5;padding:12px;border-radius:10px}.credit{font-size:12px;color:#4c6370;margin-bottom:0}.table-scroll{overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px;margin:16px 0}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid #d7e1 </style></head><body><main id="demo-root"></main><template id="demo-zh-CN"><div class="topbar"><a class="brand" data-app-view="home" href="http://127.0.0.1:8501/?lang=zh-CN">LandscapeSound</a><nav aria-label="页面导航"><a data-app-view="demo" href="#scenes">四场景试听</a><a data-app-view="compare" href="#comparison">品质比较</a><a data-app-view="guide" href="http://127.0.0.1:8501/?lang=zh-CN&amp;view=guide">使用指南</a><a data-app-view="notices" href="http://127.0.0.1:8501/?lang=zh-CN&amp;view=notices">来源与许可</a></nav><div class="languages" aria-label="界面语言"><a data-language="zh-CN" lang="zh-CN" href="?lang=zh-CN" aria-current="true">中文</a><a data-language="en" lang="en" href="?lang=en">English</a></div></div><header><div class="eyebrow">LANDSCAPESOUND · 公开试听</div><h1>一幅风景，一段声景。</h1><p>四张全新摄影全景，经主应用自动完成 GPT 理解、本机音效生成和中文导览。每张图都有独立音轨；这些声音是模拟，配音是神经合成，并非地点实录或真人录音。</p></header><aside class="note"><strong>先从舒适的音量开始。</strong><p>建议戴耳机。播放任意一段声音会停止页面内其他声音；你可以随时暂停。页面不调用 GPT、模型或在线语音服务，所有试听文件都在此包内。</p><button type="button" data-stop-audio>暂停所有声音</button></aside><section id="comparison"><h2>溪流还是雨：问题仍然存在</h2><p>本轮自动内容诊断没有支持“流水雨感已解决”。浅溪仍更接近降雨标签，岩壁瀑布的水势也被弱化；街道与水景较容易分开。这些是 CLAP 表征接近度，不是人耳辨识率或自然度评分。</p><div class="table-scroll"><table><thead><tr><th>场景</th><th>溪流</th><th>降雨</th><th>瀑布</th><th>观察</th></tr></thead><tbody><tr><td>浅溪低跌水</td><td>0.535</td><td>0.620</td><td>0.376</td><td>仍有雨声混淆信号</td></tr><tr><td>岩壁瀑布</td><td>0.638</td><td>0.619</td><td>0.463</td><td>更像细溪，水势表达不足</td></tr></tbody></table></div><p>两种流水的音频表征相似度为0.861；街道与三水景约0.200–0.263，差别较清楚。海边与流水也偏相近。所有四条新结果均保留；没有按分数换成旧素材。</p><p class="credit">内容指标基于统一28秒、约−23 LUFS的未压缩对照WAV。下方OGG是有损试听副本，未对OGG重新评分。四段配音约25.7–27.8秒，精确文字缓存已核验，未进行人耳自然度评分。</p></section><div id="scenes" class="grid"><article><img src="images/monbachtal_riverbank.jpg" alt="苔岩浅溪与低跌水，完整等距柱状全景"><div class="content"><span class="tag">浅溪</span><h2>苔岩浅溪与低跌水</h2><p>林地中可见高大树木、裸露树根、落叶与覆有苔藓的岩石。；前方层状岩壁之间可见浅溪、数级小跌水和岩石间的水面。</p><label>本图模拟声景 · 28 秒（OGG 有损试听副本）</label><audio controls preload="metadata" aria-label="苔岩浅溪与低跌水，模拟声景" src="audio/monbachtal_riverbank.ogg"></audio><label>本图自然中文导览 · 晓晓神经女声</label><audio controls preload="metadata" aria-label="苔岩浅溪与低跌水，中文神经导览" src="narration/monbachtal_riverbank.mp3"></audio><details><summary>导览文字与声音提示词</summary><h3>中文导览原文</h3><p lang="zh-CN">你面前是一片岩石环绕的林间浅溪，中央能看到几级小跌水，水面之间散布着大小石块。左侧岩壁层理明显，部分表面覆着青苔；右侧是露出树根的土坡和小径，回头还能看见斜横的倒木。这只是图片中的景观估计，流水声将作模拟，水边是否便于通行仍不确定。</p><h3>声音提示词（英文原文）</h3><p><strong>stream</strong></p><pre lang="en">A gentle connected stream flows through narrow stone channels, with rounded low gurgles beneath a soft liquid murmur. Small cascades add occasional fuller burbles that swell briefly and settle back into the continuous current. Let the texture vary slowly, leaving quiet gaps between the more distinct gurgles while the underlying flow remains smooth and modest in intensity. Keep the described water scale and rhythm: continuous irregular liquid movement, with falling water only where described; avoid rain-on-leaves ticks and a uniform broadband rain curtain.</pre></details><p class="credit"><span>全景来源：</span><a href="https://polyhaven.com/a/monbachtal_riverbank">Monbachtal Riverbank</a> · Andreas Mischok · <a href="https://polyhaven.com/license">摄影 CC0</a> · Powered by Poly Haven</p></div></article><article><img src="images/crystal_falls.jpg" alt="岩壁瀑布与开阔水潭，完整等距柱状全景"><div class="content"><span class="tag">岩壁瀑布</span><h2>岩壁瀑布与开阔水潭</h2><p>岩壁一侧可见白色瀑布水带，下方连接浅水池和岩石间的水道。；前方可见大小不一的岩石，周围有树木、树根和浓密枝叶。</p><label>本图模拟声景 · 28 秒（OGG 有损试听副本）</label><audio controls preload="metadata" aria-label="岩壁瀑布与开阔水潭，模拟声景" src="audio/crystal_falls.ogg"></audio><label>本图自然中文导览 · 晓晓神经女声</label><audio controls preload="metadata" aria-label="岩壁瀑布与开阔水潭，中文神经导览" src="narration/crystal_falls.mp3"></audio><details><summary>导览文字与声音提示词</summary><h3>中文导览原文</h3><p lang="zh-CN">从画面看，你像是站在树木环绕的岩石浅水边。前方散布着大小石块，右侧是一片沙砾地和巨石；转向左后方，能看见岩壁上的白色瀑布，以及下方相连的浅水。这里的声音仅作模拟，实际水势、距离和响度无法凭照片确定，水边能否安全通行也无法判断。</p><h3>声音提示词（英文原文）</h3><p><strong>stream</strong></p><pre lang="en">A connected rocky stream flows with rounded low gurgles and smooth liquid movement through uneven channels. A fuller falling-water layer gently swells behind the nearer current, blending into soft pool resonance. Small surges arrive irregularly, followed by brief openings between foreground burbles while the underlying flow remains continuous. Keep the texture spacious, fluid, and moderately dense, with gradual changes in emphasis. Keep the described water scale and rhythm: continuous irregular liquid movement, with falling water only where described; avoid rain-on-leaves ticks and a uniform broadband rain curtain.</pre></details><p class="credit"><span>全景来源：</span><a href="https://polyhaven.com/a/crystal_falls">Crystal Falls</a> · Greg Zaal · <a href="https://polyhaven.com/license">摄影 CC0</a> · Powered by Poly Haven</p></div></article><article><img src="images/secluded_beach.jpg" alt="沙石海滩与近岸浪线，完整等距柱状全景"><div class="content"><span class="tag">海边</span><h2>沙石海滩与近岸浪线</h2><p>前方是湾状水面，水中和岸边分布着大小不一的圆钝岩石。；浅色沙滩环绕近岸水面，沙上散落深色条状物和一条较长的褐色带状物。</p><label>本图模拟声景 · 28 秒（OGG 有损试听副本）</label><audio controls preload="metadata" aria-label="沙石海滩与近岸浪线，模拟声景" src="audio/secluded_beach.ogg"></audio><label>本图自然中文导览 · 晓晓神经女声</label><audio controls preload="metadata" aria-label="沙石海滩与近岸浪线，中文神经导览" src="narration/secluded_beach.mp3"></audio><details><summary>导览文字与声音提示词</summary><h3>中文导览原文</h3><p lang="zh-CN">你面前是一片被岩石围出的湾状水面，浅色沙滩沿两侧展开，沙上散落着深色条状物。向右看，树枝伸向明亮的天空；转到后方，则是较密的灌木和树木。根据画面估计，这里像是一处小海湾，但水深、浪况和通行条件无法确认，预体验中的浪声也只是模拟。</p><h3>声音提示词（英文原文）</h3><p><strong>surf</strong></p><pre lang="en">Gentle shoreline surf rises in slow, rounded swells, unfolding into soft, shallow washes across sand. Each wash thins into a delicate retreat with a faint granular texture. Small wave groups vary subtly in strength and spacing, leaving generous quiet intervals with a low residual water murmur. Keep the overall character restrained, spacious, and softly pulsing.</pre></details><p class="credit"><span>全景来源：</span><a href="https://polyhaven.com/a/secluded_beach">Secluded Beach</a> · Greg Zaal、Rico Cilliers · <a href="https://polyhaven.com/license">摄影 CC0</a> · Powered by Poly Haven</p></div></article><article><img src="images/urban_street_03.jpg" alt="住宅街道与路边停车，完整等距柱状全景"><div class="content"><span class="tag">街道</span><h2>住宅街道与路边停车</h2><p>道路向前方和后方延伸，两侧可见停放的汽车、路缘和人行道。；右侧是一排带白色窗框和拱形门廊的多层砖楼，前方有灌木和矮墙。</p><label>本图模拟声景 · 28 秒（OGG 有损试听副本）</label><audio controls preload="metadata" aria-label="住宅街道与路边停车，模拟声景" src="audio/urban_street_03.ogg"></audio><label>本图自然中文导览 · 晓晓神经女声</label><audio controls preload="metadata" aria-label="住宅街道与路边停车，中文神经导览" src="narration/urban_street_03.mp3"></audio><details><summary>导览文字与声音提示词</summary><h3>中文导览原文</h3><p lang="zh-CN">眼前是一条两侧排列住宅的街道，路边停着多辆汽车，灰白云层铺满天空。朝右看，多层砖楼带着白色窗框，门前围着灌木和矮墙；朝左是砖墙、灰色大门与树冠。转向后方，还能看见道路和一棵宽大的树。图片无法确认车辆是否行驶，试听中的稀疏车声只是模拟。</p><h3>声音提示词（英文原文）</h3><p><strong>traffic</strong></p><pre lang="en">A simulated quiet residential street ambience with occasional distant vehicle pass-bys. Soft engine tones gradually emerge, accompanied by a restrained rolling tire texture, then gently recede. Keep the events sparse and irregular, separated by long quiet intervals. Use subtle changes in pitch and level to suggest unhurried passage, with a subdued, spacious background. Keep the described traffic rhythm and distance, with distinct engine and rolling-tire events separated in time rather than a generic broadband noise bed.</pre></details><p class="credit"><span>全景来源：</span><a href="https://polyhaven.com/a/urban_street_03">Urban Street 03</a> · Andreas Mischok · <a href="https://polyhaven.com/license">摄影 CC0</a> · Powered by Poly Haven</p></div></article></div><footer><p>图像方位、虚拟远近和动态声音均为模拟设定；静态图片不能确认现场响度、流速、通行或避障条件。</p><p><a href="metadata.json">来源、提示词、文件指纹与公开元数据</a> · <a data-app-view="notices" href="../THIRD_PARTY_NOTICES.zh-CN.md">第三方来源与许可</a></p><p>仅公开演示所需的白名单字段；模型、环境、原始日志与登录资料不在此包内。</p></footer></template><template id="demo-en"><div class="topbar"><a class="brand" data-app-view="home" href="http://127.0.0.1:8501/?lang=en">LandscapeSound</a><nav aria-label="Page navigation"><a data-app-view="demo" href="#scenes">Listen to four scenes</a><a data-app-view="compare" href="#comparison">Quality comparison</a><a data-app-view="guide" href="http://127.0.0.1:8501/?lang=en&amp;view=guide">User guide</a><a data-app-view="notices" href="http://127.0.0.1:8501/?lang=en&amp;view=notices">Sources and licences</a></nav><div class="languages" aria-label="Interface language"><a data-language="zh-CN" lang="zh-CN" href="?lang=zh-CN">中文</a><a data-language="en" lang="en" href="?lang=en" aria-current="true">English</a></div></div><header><div class="eyebrow">LANDSCAPESOUND · PUBLIC DEMO</div><h1>A landscape, a soundscape.</h1><p>Four new photographic panoramas processed automatically in the main app: GPT scene understanding, local sound generation and Chinese narration. Each image has its own audio. Soundscapes are simulated and narration is neural synthesis; neither is a recording of the pictured site or a human voice recording.</p></header><aside class="note"><strong>Start at a comfortable volume.</strong><p>Headphones are recommended. Playing any clip pauses the other clips on this page, and you can pause at any time. This page makes no GPT, model or online speech-service calls; every listening file is included in this package.</p><button type="button" data-stop-audio>Pause all audio</button></aside><section id="comparison"><h2>Stream or rain: the problem remains</h2><p>This round of automatic content diagnostics does not support the claim that rain-like flowing water has been resolved. The shallow stream remains closer to the rain label, and the rock-face waterfall sounds weaker than its setting suggests. Street and water scenes are easier to separate. These are CLAP representation similarities, not human recognition rates or naturalness scores.</p><div class="table-scroll"><table><thead><tr><th>Scene</th><th>Stream</th><th>Rain</th><th>Waterfall</th><th>Observation</th></tr></thead><tbody><tr><td>Shallow stream / small cascades</td><td>0.535</td><td>0.620</td><td>0.376</td><td>Rain confusion remains</td></tr><tr><td>Rock-face waterfall</td><td>0.638</td><td>0.619</td><td>0.463</td><td>Closer to a small stream; insufficient force</td></tr></tbody></table></div><p>The two flowing-water clips have an audio-representation similarity of 0.861. Street-to-water similarities are approximately 0.200–0.263, showing clearer separation. The coast is also relatively close to flowing water. All four new results are retained; none was replaced with an older clip to improve scores.</p><p class="credit">Content metrics use the uncompressed comparison WAVs, each 28 seconds and approximately −23 LUFS. The OGG files below are lossy listening copies and were not re-scored. The four narration clips last approximately 25.7–27.8 seconds; their exact-text caches were verified, but human naturalness was not scored.</p></section><div id="scenes" class="grid"><article><img src="images/monbachtal_riverbank.jpg" alt="Mossy stream and small cascades, complete equirectangular panorama"><div class="content"><span class="tag">Shallow stream</span><h2>Mossy stream and small cascades</h2><p>Tall trees, exposed roots, fallen leaves and moss-covered rocks are visible in the woodland. A shallow stream, several small cascades and water between rocks are visible in front of layered rock faces.</p><label>Scene-specific simulated soundscape · 28 s (lossy OGG listening copy)</label><audio controls preload="metadata" aria-label="Mossy stream and small cascades, simulated soundscape" src="audio/monbachtal_riverbank.ogg"></audio><label>Chinese narration (original) · Xiaoxiao neural female voice</label><audio controls preload="metadata" aria-label="Mossy stream and small cascades, original Chinese neural narration" src="narration/monbachtal_riverbank.mp3"></audio><details><summary>Narration text and sound prompts</summary><h3>Narration translation and original Chinese text</h3><p>In front of you is a shallow woodland stream surrounded by rocks, with several small cascades in the centre and stones scattered between the pools. Layered rock faces, partly covered in moss, rise to the left. To the right are a dirt slope with exposed roots and a path; looking back reveals a leaning fallen trunk. These are estimates from the image. The flowing-water sound is simulated, and access along the water remains uncertain.</p><p class="credit">English translation for reading only; the audio remains the original Chinese narration.</p><p lang="zh-CN">你面前是一片岩石环绕的林间浅溪，中央能看到几级小跌水，水面之间散布着大小石块。左侧岩壁层理明显，部分表面覆着青苔；右侧是露出树根的土坡和小径，回头还能看见斜横的倒木。这只是图片中的景观估计，流水声将作模拟，水边是否便于通行仍不确定。</p><h3>Sound prompts (original English)</h3><p><strong>stream</strong></p><pre lang="en">A gentle connected stream flows through narrow stone channels, with rounded low gurgles beneath a soft liquid murmur. Small cascades add occasional fuller burbles that swell briefly and settle back into the continuous current. Let the texture vary slowly, leaving quiet gaps between the more distinct gurgles while the underlying flow remains smooth and modest in intensity. Keep the described water scale and rhythm: continuous irregular liquid movement, with falling water only where described; avoid rain-on-leaves ticks and a uniform broadband rain curtain.</pre></details><p class="credit"><span>Panorama: </span><a href="https://polyhaven.com/a/monbachtal_riverbank">Monbachtal Riverbank</a> · Andreas Mischok · <a href="https://polyhaven.com/license">Photography: CC0</a> · Powered by Poly Haven</p></div></article><article><img src="images/crystal_falls.jpg" alt="Rock-face waterfall and open pool, complete equirectangular panorama"><div class="content"><span class="tag">Rock-face waterfall</span><h2>Rock-face waterfall and open pool</h2><p>A white waterfall is visible against one side of the rock face, feeding a shallow pool and a channel between rocks. Rocks of different sizes lie in front, surrounded by trees, roots and dense foliage.</p><label>Scene-specific simulated soundscape · 28 s (lossy OGG listening copy)</label><audio controls preload="metadata" aria-label="Rock-face waterfall and open pool, simulated soundscape" src="audio/crystal_falls.ogg"></audio><label>Chinese narration (original) · Xiaoxiao neural female voice</label><audio controls preload="metadata" aria-label="Rock-face waterfall and open pool, original Chinese neural narration" src="narration/crystal_falls.mp3"></audio><details><summary>Narration text and sound prompts</summary><h3>Narration translation and original Chinese text</h3><p>The image suggests a position beside rocky shallow water surrounded by trees. Stones of different sizes lie ahead; to the right are gravel and large boulders. Turning towards the left rear reveals a white waterfall on the rock face and connected shallow water below. The sound is simulated. The photograph cannot establish the actual water force, distance or loudness, or whether the waterside is safe to access.</p><p class="credit">English translation for reading only; the audio remains the original Chinese narration.</p><p lang="zh-CN">从画面看，你像是站在树木环绕的岩石浅水边。前方散布着大小石块，右侧是一片沙砾地和巨石；转向左后方，能看见岩壁上的白色瀑布，以及下方相连的浅水。这里的声音仅作模拟，实际水势、距离和响度无法凭照片确定，水边能否安全通行也无法判断。</p><h3>Sound prompts (original English)</h3><p><strong>stream</strong></p><pre lang="en">A connected rocky stream flows with rounded low gurgles and smooth liquid movement through uneven channels. A fuller falling-water layer gently swells behind the nearer current, blending into soft pool resonance. Small surges arrive irregularly, followed by brief openings between foreground burbles while the underlying flow remains continuous. Keep the texture spacious, fluid, and moderately dense, with gradual changes in emphasis. Keep the described water scale and rhythm: continuous irregular liquid movement, with falling water only where described; avoid rain-on-leaves ticks and a unif ">Gentle shoreline surf rises in slow, rounded swells, unfolding into soft, shallow washes across sand. Each wash thins into a delicate retreat with a faint granular texture. Small wave groups vary subtly in strength and spacing, leaving generous quiet intervals with a low residual water murmur. Keep the overall character restrained, spacious, and softly pulsing.</pre></details><p class="credit"><span>Panorama: </span><a href="https://polyhaven.com/a/secluded_beach">Secluded Beach</a> · Greg Zaal, Rico Cilliers · <a href="https://polyhaven.com/license">Photography: CC0</a> · Powered by Poly Haven</p></div></article><article><img src="images/urban_street_03.jpg" alt="Residential street and parked cars, complete equirectangular panorama"><div class="content"><span class="tag">Street</span><h2>Residential street and parked cars</h2><p>The road extends forwards and backwards, with parked cars, kerbs and pavements on both sides. To the right is a row of multi-storey brick buildings with white window frames and arched entrances, fronted by shrubs and low walls.</p><label>Scene-specific simulated soundscape · 28 s (lossy OGG listening copy)</label><audio controls preload="metadata" aria-label="Residential street and parked cars, simulated soundscape" src="audio/urban_street_03.ogg"></audio><label>Chinese narration (original) · Xiaoxiao neural female voice</label><audio controls preload="metadata" aria-label="Residential street and parked cars, original Chinese neural narration" src="narration/urban_street_03.mp3"></audio><details><summary>Narration text and sound prompts</summary><h3>Narration translation and original Chinese text</h3><p>A residential street stretches ahead, with cars parked along both sides beneath grey-white clouds. To the right, multi-storey brick buildings have white window frames, with shrubs and low walls in front. To the left are a brick wall, grey gates and tree crowns. Looking behind reveals the road and a broad tree. The photograph cannot confirm
